<section class="login-block">
    <div class="container">
        <div class="row">
            <div class="col-sm-12">
                <form
                    class="md-float-material form-material login-form"
                    action="javascript:void(0);"
                >
                    <div class="text-center login-logo">
                        <img src="assets/images/logo_omg.png" alt="omg.png" />
                    </div>
                    <div class="auth-box card login-card">
                        <div class="card-block">
                            <div class="row m-b-20 login-header">
                                <div class="col-md-12">
                                    <h3 class="text-center login-title">Iniciar sesion</h3>
                                    <p class="text-center login-subtitle">
                                        Accede con tus credenciales para continuar
                                    </p>
                                </div>
                            </div>

                            <ng-container *ngIf="!user.code_sent">
                                <div class="form-group form-primary login-field">
                                    <input
                                        #email="ngModel"
                                        type="text"
                                        name="email"
                                        class="form-control"
                                        [(ngModel)]="user.email"
                                        required
                                        email
                                    />
                                    <span class="form-bar"></span>
                                    <label class="float-label">
                                        Correo electronico
                                    </label>
                                    <small
                                        class="text-danger messages"
                                        *ngIf="
                                            email.invalid &&
                                            (email.dirty || email.touched) &&
                                            email.errors?.email
                                        "
                                    >
                                        Favor de escribir un correo electronico
                                        valido
                                    </small>
                                    <small
                                        class="text-danger messages"
                                        *ngIf="
                                            email.invalid &&
                                            (email.dirty || email.touched) &&
                                            email.errors?.required
                                        "
                                    >
                                        Campo requerido
                                    </small>
                                </div>

                                <div class="form-group form-primary login-field">
                                    <input
                                        #contrasena="ngModel"
                                        type="password"
                                        name="contrasena"
                                        class="form-control"
                                        [(ngModel)]="user.password"
                                        (keyup.enter)="login()"
                                        required
                                    />
                                    <span class="form-bar"></span>
                                    <label class="float-label">
                                        Contrasena
                                    </label>
                                    <small
                                        class="text-danger messages"
                                        *ngIf="
                                            contrasena.invalid &&
                                            (contrasena.dirty ||
                                                contrasena.touched) &&
                                            contrasena.errors?.required
                                        "
                                    >
                                        Campo requerido
                                    </small>
                                </div>

                                <div class="row m-t-20 text-left">
                                    <div class="col-12">
                                        <div
                                            class="forgot-phone text-right f-right"
                                        >
                                            <a
                                                [routerLink]="['/auth/forgot']"
                                                class="text-right f-w-600 login-link"
                                            >
                                                Recuperar contrasena
                                            </a>
                                        </div>
                                    </div>
                                </div>
                            </ng-container>

                            <div
                                class="form-group form-primary login-field otp-group"
                                *ngIf="user.code_sent"
                            >
                                <label class="otp-label">
                                    Codigo de confirmacion (Whatsapp)
                                </label>
                                <div class="otp-inputs" (paste)="onOtpPaste($event)">
                                    <input
                                        *ngFor="let digit of otpDigits; let i = index"
                                        [id]="'otp-' + i"
                                        type="text"
                                        inputmode="numeric"
                                        pattern="[0-9]*"
                                        maxlength="1"
                                        class="form-control otp-box"
                                        [name]="'waCode' + i"
                                        [ngModel]="otpDigits[i]"
                                        (ngModelChange)="otpDigits[i] = $event"
                                        (input)="onOtpInput(i, $event)"
                                        (keydown)="onOtpKeydown(i, $event)"
                                        (keyup.enter)="login()"
                                        autocomplete="one-time-code"
                                    />
                                </div>
                            </div>

                            <div class="row m-t-30">
                                <div class="col-md-12">
                                    <button
                                        type="button"
                                        class="btn btn-outline-primary btn-sm btn-block m-b-20 http-disabled login-submit"
                                        (click)="login()"
                                    >
                                        Iniciar sesion
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>

<div class="welcome-splash" *ngIf="splashVisible">
    <div class="welcome-splash__glow"></div>
    <div class="welcome-splash__card">
        <div class="welcome-splash__logo-wrap">
            <img
                src="assets/images/logo_omg.png"
                alt="AFA Innovations"
                class="welcome-splash__logo"
            />
        </div>

        <div class="welcome-splash__eyebrow">Bienvenido a</div>
        <div class="welcome-splash__brand">AFA Innovations</div>
        <div class="welcome-splash__user">{{ splashUserName }}</div>
        <div class="welcome-splash__meta">{{ splashDateText }}</div>

        <div class="welcome-splash__loader">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>
</div>
